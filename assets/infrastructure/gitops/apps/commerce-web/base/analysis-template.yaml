# envoy_cluster_name의 backend/1 구분은 실제 계열과 HTTPRoute backendRef를 대조할 전제입니다. 가중 backend가 rule 단위 클러스터 하나로 묶이면 이 질의는 canary 계열을 찾지 못합니다. BU14/16–17의 Prometheus 원문 조회로 확인하며 표본 없는 판정을 통과로 쓰지 않습니다.
# 5xx 시계열이 없고 실제 총 요청량이 양수일 때만 분자의 0을 사용합니다. 총 요청량·histogram count가 없거나 0이면 결과는 빈 벡터이며 len(result) 조건에서 실패합니다. Prometheus 조회 오류는 측정 Error입니다.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: commerce-web-5xx-rate                   # 예: commerce-web-5xx-rate (Rollout steps[].analysis.templates 가 가리키는 이름)
spec:
  metrics:
    - name: five-xx-rate                        # 예: 5xx 비율 (0 ~ 1)
      interval: 30s                             # 예: 30초마다
      count: 5                                  # 예: 5회 (소요 시간은 실제 측정 시각으로 확인)
      successCondition: len(result) > 0 && result[0] <= 0.01       # 예: 1% 이하면 통과 (dev 정책; prod 는 overlay 로 더 엄격하게)
      failureLimit: 0                           # 예: 실패 1회면 판정 실패 → abort
      consecutiveErrorLimit: 2                  # 예: provider 조회 Error가 연속 3회면 판정 Error. 정상 응답의 빈 벡터는 successCondition을 만족하지 않아 Failed
      provider:
        prometheus:
          address: http://platform-thanos-query.monitoring.svc.cluster.local:9090 # 예: 관측 파이프라인 Thanos Query (클러스터 내부 DNS — 환경 무관)
          timeout: 10                           # 예: 10초 (Thanos 가 응답하지 않으면 측정 Error — 무한 대기 없음)
          query: |
            (
              (sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/contract2whale-demo/app-ui/rule/0/backend/1",envoy_response_code_class="5"}[2m])) or vector(0))
              /
              (sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/contract2whale-demo/app-ui/rule/0/backend/1"}[2m])) > 0)
            )
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: commerce-web-latency                    # 예: commerce-web-latency
spec:
  metrics:
    - name: p95-latency                         # 예: p95 응답 시간 (밀리초 — Envoy 의 upstream_rq_time 단위)
      interval: 30s
      count: 5
      successCondition: len(result) > 0 && result[0] < 800         # 예: 800ms 미만이면 통과 (Next.js 서버 렌더 기준; prod 는 overlay 로 더 엄격하게)
      failureLimit: 0
      consecutiveErrorLimit: 2
      provider:
        prometheus:
          address: http://platform-thanos-query.monitoring.svc.cluster.local:9090
          timeout: 10
          query: |
            (
              histogram_quantile(0.95, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="httproute/contract2whale-demo/app-ui/rule/0/backend/1"}[2m])))
              and
              (sum(rate(envoy_cluster_upstream_rq_time_count{envoy_cluster_name="httproute/contract2whale-demo/app-ui/rule/0/backend/1"}[2m])) > 0)
            )
