# gitops/apps/commerce-web/base/service-canary.yaml — canary 버전 스토어프런트 Pod 를 고르는 Service
# 판정 지표는 이 Service 를 가리키는 Envoy 클러스터(.../rule/0/backend/1)의 응답 코드 · 지연이라, 이 backendRef 의 순서가 바뀌면 판정 대상이 바뀝니다 (analysis-template.yaml).
apiVersion: v1
kind: Service
metadata:
  name: commerce-web-canary                     # 예: commerce-web-canary (Rollout strategy.canary.canaryService · HTTPRoute backendRefs[1])
  labels:
    app.kubernetes.io/name: commerce-web        # 예: commerce-web
    app.kubernetes.io/component: canary         # 예: canary
spec:
  type: ClusterIP                               # 예: ClusterIP
  selector:
    app.kubernetes.io/name: commerce-web        # 예: Pod label 과 같은 값 (Rollouts 가 pod-template-hash 를 추가)
  ports:
    - {name: http, port: 3000, targetPort: http, protocol: TCP} # 예: 3000
