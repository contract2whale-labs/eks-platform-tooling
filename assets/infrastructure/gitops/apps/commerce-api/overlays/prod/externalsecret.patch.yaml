apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-api-runtime
spec:
  dataFrom:
  - extract:
      key: contract2whale/prod/commerce-api/runtime
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-api-migration
spec:
  dataFrom:
  - extract:
      key: contract2whale/prod/commerce-api/runtime
  - extract:
      key: contract2whale/prod/commerce-api/migration
