# gitops/apps/commerce-api/base/kustomization.yaml — 커머스 백엔드의 환경 무관 선언 묶음
# Rollout 이 없으므로 rollout-transform.yaml 같은 파일이 필요 없습니다 — Deployment 의 ConfigMap · Secret 참조는 Kustomize 기본 설정에 이미 들어 있습니다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- externalsecret.yaml
- deployment.yaml
- service.yaml
- httproute-store.yaml
- migration-job.yaml
- httproute-auth-check.yaml
labels:
- pairs:
    app.kubernetes.io/part-of: contract2whale     # 예: contract2whale (앱 묶음 표시; selector 에는 넣지 않음)
  includeSelectors: false
