# gitops/apps/commerce-api/base/externalsecret.yaml — Secrets Manager 의 비밀을 앱이 읽는 Secret 2개로 복사하는 선언
# 앱 데이터 연결: Medusa는 DATABASE_URL, REDIS_URL, JWT_SECRET, COOKIE_SECRET을 환경 변수로 받습니다. External Secrets Operator가 외부 저장소의 값을 Kubernetes Secret으로 동기화하며, Git에는 참조만 저장합니다.
# 실행 계정(runtime)과 스키마 변경 계정(migration)은 다른 DB 사용자입니다 — 앱은 runtime, PreSync 마이그레이션 Job 은 migration 을 씁니다. migration 쪽은 DB 자격만 다르고 Redis · 앱 시크릿은 같은 값이라 runtime 비밀에서 함께 가져옵니다(dataFrom 은 뒤 항목이 앞을 덮습니다).
# 세 선언 모두 PreSync 훅입니다: PreSync 단계에서는 본 동기화의 리소스가 아직 없으므로, 여기가 훅이 아니면 같은 단계의 마이그레이션 Job 이 참조할 Secret 이 만들어지지 않습니다. sync-wave -1 이라 Job(wave 0) 보다 먼저 적용되고, hook-delete-policy 를 HookFailed 로 두어 성공한 선언은 지워지지 않고 남습니다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: commerce-secrets                        # 예: commerce-secrets (아래 ExternalSecret 2개가 가리키는 이름)
  annotations:
    argocd.argoproj.io/hook: PreSync            # 예: PreSync (마이그레이션 Job 과 같은 단계, 더 앞 wave)
    argocd.argoproj.io/hook-delete-policy: HookFailed # 예: 실패했을 때만 지움 (성공하면 남아서 값을 계속 갱신)
    argocd.argoproj.io/sync-wave: "-1"          # 예: -1 (Job wave 0 보다 먼저)
spec:
  provider:
    aws:
      service: SecretsManager                   # 예: SecretsManager
      region: ap-northeast-2                    # 예: ap-northeast-2 (두 환경이 같은 리전)
      role: REPLACED_BY_OVERLAY                 # 예: arn:aws:iam::<계정>:role/platform/<클러스터>-data-app-secrets (overlays/<env> patch — ESO controller 가 맡을 읽기 전용 역할)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-api-runtime                    # 예: commerce-api-runtime (Deployment 의 envFrom 이 읽는 Secret 과 같은 이름)
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h                           # 예: 1h (비밀 회전 뒤 1시간 안에 Secret 이 바뀌고 Reloader 가 Pod 를 재기동)
  secretStoreRef:
    name: commerce-secrets                      # 예: 위 SecretStore
    kind: SecretStore
  target:
    name: commerce-api-runtime                  # 예: 만들 Secret 이름
    creationPolicy: Owner                       # 예: Owner (이 정의가 사본을 소유)
    deletionPolicy: Retain                      # 예: Retain (원본을 못 찾을 때 사본을 지우지 않음 — 실행 중인 Pod 가 값을 잃지 않음)
    template:
      engineVersion: v2                         # 예: v2
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}" # 예: postgres://commerce_runtime:…@…rds.amazonaws.com:5432/commercedb (Medusa projectConfig.databaseUrl — sslmode 를 붙이지 않음: TLS 는 DB_SSL=true 가 정하고, URL 의 sslmode 는 앱이 넣는 CA 설정을 덮어써서 앱이 기동을 거부함)
        REDIS_URL: "{{ .redis_url }}"           # 예: rediss://…serverless.apn2.cache.amazonaws.com:6379 (Redis 모듈 4개 + 세션 저장소가 함께 쓰는 주소)
        JWT_SECRET: "{{ .jwt_secret }}"         # 예: 토큰 서명 키 (production 에서 없으면 기동 오류)
        COOKIE_SECRET: "{{ .cookie_secret }}"   # 예: 쿠키 서명 키 (production 에서 없으면 기동 오류)
  dataFrom:
    - extract: {key: REPLACED_BY_OVERLAY}       # 예: contract2whale/dev/commerce-api/runtime (overlays/<env> patch — 속성 8개: username · password · host · port · dbname · redis_url · jwt_secret · cookie_secret)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-api-migration                  # 예: commerce-api-migration (PreSync 마이그레이션 Job 의 envFrom 이 읽는 Secret)
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookFailed
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: commerce-secrets
    kind: SecretStore
  target:
    name: commerce-api-migration
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}" # 예: 스키마를 바꿀 수 있는 계정 (실행 계정과 다른 사용자; 위와 같은 이유로 sslmode 없음 — Job 의 DB_SSL=true 가 TLS 를 켬)
        REDIS_URL: "{{ .redis_url }}"           # 예: 마이그레이션도 모듈을 모두 싣기 때문에 Redis 주소가 필요합니다
        JWT_SECRET: "{{ .jwt_secret }}"         # 예: 설정을 읽는 단계에서 production 검사를 통과하기 위해 필요
        COOKIE_SECRET: "{{ .cookie_secret }}"   # 예: 같은 이유
  dataFrom:
    - extract: {key: REPLACED_BY_OVERLAY}       # 예: contract2whale/dev/commerce-api/runtime (redis_url · jwt_secret · cookie_secret 를 가져옴)
    - extract: {key: REPLACED_BY_OVERLAY}       # 예: contract2whale/dev/commerce-api/migration (뒤 항목이 앞을 덮으므로 username · password 는 이쪽 값)
