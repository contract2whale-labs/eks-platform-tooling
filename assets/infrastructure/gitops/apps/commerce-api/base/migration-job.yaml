# gitops/apps/commerce-api/base/migration-job.yaml — 스키마 변경을 배포보다 먼저 끝내는 PreSync Job
# 같은 앱 이미지의 다른 진입점입니다 — 이미지 안의 ./node_modules/.bin/medusa 를 직접 부릅니다(`npx medusa db:migrate --execute-safe-links` 와 같은 명령이며, readOnlyRootFilesystem 에서 npx 가 캐시를 쓰려다 실패하는 경우를 피합니다). --execute-safe-links 는 비대화형 실행에서 링크 마이그레이션까지 확인 없이 진행하게 합니다.
# 시드 데이터는 따로 실행하지 않습니다 — 이 마이그레이션이 도는 동안 src/migration-scripts/initial-data-seed.ts 가 처음 한 번 자동으로 실행됩니다.
# 신원은 이 Job 만 쓰는 SA delivery-migration(앱 네임스페이스와 수집 허용; Pod Identity → 배포 플랫폼이 만든 delivery-migration Role — 읽을 수 있는 것은 마이그레이션 · 앱 비밀 둘뿐)이고, DB 자격은 실행 계정이 아니라 스키마 변경 계정입니다 (Secret commerce-api-migration). 초기화 · 진단 Job 의 database-operator 와 신원을 나눠, 스키마를 바꾸는 순간의 권한이 운영 도구의 권한을 물려받지 않게 합니다. Kyverno 는 이 Job 의 이미지도 같은 서명 규칙으로 검사합니다.
# env 를 ConfigMap 이 아니라 여기에 직접 적는 이유: PreSync 단계에는 본 동기화의 ConfigMap 이 아직 없습니다. 값은 모두 환경과 무관한 상수이고, 환경마다 다른 것은 Secret 하나뿐입니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: commerce-api-migrate                    # 예: commerce-api-migrate (동기화마다 BeforeHookCreation 으로 새로 만듦)
  annotations:
    argocd.argoproj.io/hook: PreSync            # 예: PreSync (Deployment 보다 먼저; 실패 시 동기화 중단)
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation # 예: 다음 동기화가 이전 Job 을 지운 뒤 새로 만듦 (실패 Job 의 로그는 그때까지 남음)
    argocd.argoproj.io/sync-wave: "0"           # 예: 0 (같은 PreSync 단계의 ExternalSecret wave -1 뒤)
spec:
  backoffLimit: 0                               # 예: 0 (실패해도 Pod 재시도 없음 — 재실행은 새 동기화)
  activeDeadlineSeconds: 600                    # 예: 600 (10분 넘으면 실패)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commerce-api-migrate # 예: commerce-api-migrate (NetworkPolicy · 로그 조회가 보는 label)
    spec:
      serviceAccountName: delivery-migration    # 예: delivery-migration (앱 네임스페이스와 수집 허용 SA · 이 Job 전용)
      automountServiceAccountToken: false       # 예: false
      restartPolicy: Never                      # 예: Never
      nodeSelector: {workload: app}             # 예: app 노드 그룹
      securityContext:
        runAsNonRoot: true                      # 예: true
        runAsUser: 10001                        # 예: 10001 (앱 이미지의 비root 사용자)
        runAsGroup: 10001                       # 예: 10001
        fsGroup: 10001                          # 예: 10001
        seccompProfile: {type: RuntimeDefault}  # 예: RuntimeDefault
      containers:
        - name: migrate                         # 예: migrate
          image: commerce-api                   # 예: overlay 의 images 가 앱 이미지와 같은 digest 로 바꿈 (별도 migration 이미지 없음)
          command: ["./node_modules/.bin/medusa", "db:migrate", "--execute-safe-links"] # 예: 스키마 · 링크 마이그레이션 (첫 실행에서 시드도 함께 돎)
          env:
            - {name: NODE_ENV, value: production}       # 예: production (설정 검사를 실제 배포와 같은 조건으로 둠)
            - {name: PORT, value: "9000"}               # 예: 9000 (HTTP 서버를 띄우지는 않지만 설정이 읽는 값)
            - {name: LOG_LEVEL, value: info}            # 예: info (요청 로그가 없는 배치라 http 단계가 필요 없음)
            - {name: DB_SSL, value: "true"}             # 예: true (RDS 연결은 TLS — 이미지 안의 RDS CA 묶음으로 서버 인증서를 검증)
            - {name: DB_POOL_MIN, value: "1"}           # 예: 1 (Job 은 연결을 적게 씁니다 — 배포 중 RDS max_connections 계산에 들어감)
            - {name: DB_POOL_MAX, value: "5"}           # 예: 5
            - {name: MEDUSA_WORKER_MODE, value: shared} # 예: shared
            - {name: STORE_CORS, value: "http://localhost:9000"}  # 예: 설정이 요구하는 값 (이 Job 은 HTTP 를 받지 않음)
            - {name: ADMIN_CORS, value: "http://localhost:9000"}  # 예: 같은 이유
            - {name: AUTH_CORS, value: "http://localhost:9000"}   # 예: 같은 이유
          envFrom:
            - secretRef: {name: commerce-api-migration} # 예: ExternalSecret 이 만든 Secret (스키마 변경 계정의 DATABASE_URL · REDIS_URL · JWT_SECRET · COOKIE_SECRET)
          volumeMounts:
            - {name: tmp, mountPath: /tmp}      # 예: Node 가 쓰는 임시 경로
          resources:
            requests: {cpu: 200m, memory: 768Mi} # 예: 200m · 768Mi
            limits: {memory: 1536Mi}            # 예: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false     # 예: false
            readOnlyRootFilesystem: true        # 예: true
            capabilities: {drop: [ALL]}         # 예: 모든 capability 제거
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}          # 예: 128Mi
