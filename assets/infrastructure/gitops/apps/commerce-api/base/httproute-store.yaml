# gitops/apps/commerce-api/base/httproute-store.yaml — 커머스 백엔드 경로의 HTTPRoute
# canary 가 없으므로 backendRefs 는 Service 하나이고 weight 를 적지 않습니다 (Argo Rollouts 가 손대지 않는 라우트).
# 이름이 팀 로그인과 API 인가 의 app-api 가 아니라 app-store 입니다: 서비스 진입 경로 의 SecurityPolicy app-api-jwt 는 Cognito 토큰을 요구하는데, /store 는 publishable key 로 부르는 공개 경로이고 /admin · /app 은 Medusa 자체 인증을 쓰므로 그 정책이 붙으면 두 경로가 모두 막힙니다. 승인 · 인가를 어디에 둘지는 서비스 진입 경로 · 데이터 초기화와 Argo CD 배포 최초 적용 가 다시 정합니다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-store                               # 예: app-store (Envoy 클러스터 이름 httproute/contract2whale-demo/app-store/rule/0/backend/0 의 근거)
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform                            # 예: 서비스 진입 경로 gateway_contract.gateway_name
      namespace: platform-gateway               # 예: platform-gateway
      sectionName: https                        # 예: 서비스 진입 경로 gateway_contract.listener_name
  hostnames: ["REPLACED_BY_OVERLAY"]            # 예: dev.<PARENT_DOMAIN> (overlays/dev patch — 스토어프런트와 같은 호스트)
  rules:
    - matches:
        - path: {type: PathPrefix, value: /store}  # 예: 상품 · 장바구니 · 주문 (헤더 x-publishable-api-key 필수)
        - path: {type: PathPrefix, value: /admin}  # 예: 관리자 API
        - path: {type: PathPrefix, value: /auth}   # 예: 로그인 · 토큰 발급
        - path: {type: PathPrefix, value: /app}    # 예: 관리자 화면 (같은 프로세스가 내려 주는 정적 자산)
      backendRefs:
        - name: commerce-api                    # 예: 단일 백엔드 (weight 없음 = 전부)
          port: 9000
