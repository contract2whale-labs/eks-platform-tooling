apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-api
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: platform
    namespace: platform-gateway
    sectionName: https
  hostnames:
  - dev.replace.example
  rules:
  - matches:
    - path:
        type: Exact
        value: /platform-auth-check
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /health
    backendRefs:
    - name: commerce-api
      port: 9000
