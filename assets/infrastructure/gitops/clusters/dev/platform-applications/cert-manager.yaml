apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cert-manager-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: platform
  sources:
  - repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      valueFiles:
      - $values/gitops/platform/cert-manager/values/dev.yaml
      - $values/gitops/platform/cert-manager/values/dev-dns.yaml
  - repoURL: git@github.com:contract2whale-labs/cloud-platform-infrastructure.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - Prune=false
    - Delete=false
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
