apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cluster-autoscaler-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  sources:
  - repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: 9.59.0
    helm:
      releaseName: cluster-autoscaler
      valueFiles:
      - $values/gitops/platform/cluster-autoscaler/values/dev.yaml
  - repoURL: git@github.com:contract2whale-labs/cloud-platform-infrastructure.git
    targetRevision: main
    ref: values
