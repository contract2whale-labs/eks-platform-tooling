apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-collection-agent-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  sources:
  - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.173.1
    helm:
      releaseName: collection-agent
      valueFiles:
      - $values/gitops/platform/collection-agent/values/dev.yaml
  - repoURL: git@github.com:contract2whale-labs/cloud-platform-infrastructure.git
    targetRevision: main
    ref: values
