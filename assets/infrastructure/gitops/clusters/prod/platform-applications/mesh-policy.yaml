apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-mesh-policy-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: platform
  source:
    repoURL: git@github.com:contract2whale-labs/cloud-platform-infrastructure.git
    targetRevision: main
    path: gitops/platform/mesh-policy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - Prune=false
      - Delete=false
      - ServerSideApply=true
