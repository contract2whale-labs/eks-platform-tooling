apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.2
    helm:
      releaseName: platform-monitoring
      valueFiles:
      - $values/gitops/platform/monitoring/values/prod.yaml
      - $values/gitops/platform/monitoring/values/prod-alerting.yaml
  - repoURL: git@github.com:contract2whale-labs/cloud-platform-infrastructure.git
    targetRevision: main
    ref: values
