apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-database-operations-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: contract2whale-demo
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
  source:
    repoURL: git@github.com:contract2whale-labs/cloud-platform-infrastructure.git
    targetRevision: main
    path: gitops/platform/database-operations/requests/prod
