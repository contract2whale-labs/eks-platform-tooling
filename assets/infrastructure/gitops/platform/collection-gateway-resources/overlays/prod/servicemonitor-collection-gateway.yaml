apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: collection-gateway
  namespace: monitoring
  labels:
    release: platform-monitoring
spec:
  namespaceSelector:
    matchNames:
    - observability
  selector:
    matchLabels:
      app.kubernetes.io/component: collection-gateway
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
