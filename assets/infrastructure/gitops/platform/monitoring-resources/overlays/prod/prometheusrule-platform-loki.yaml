apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-loki
  namespace: monitoring
  labels:
    release: platform-monitoring
spec:
  groups:
  - name: log-storage
    rules:
    - alert: LogStorageWriteRejecting
      expr: sum(rate(loki_request_duration_seconds_count{route=~".*(push|otlp).*",status_code=~"4..|5.."}[5m]))
        > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: 로그 저장소가 넣기 요청을 거부하고 있습니다
    - alert: LogStorageFlushStalled
      expr: sum(rate(loki_ingester_chunks_flush_failures_total[15m])) > 0
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: 로그 덩어리를 저장소로 올리는 작업이 반복해서 실패합니다
    - alert: LogStorageRetentionIdle
      expr: time() - max(loki_compactor_apply_retention_last_successful_run_timestamp_seconds
        > 0) > 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: 성공 이력이 있는 보존 정리의 마지막 성공 시각이 하루 넘게 갱신되지 않았습니다
