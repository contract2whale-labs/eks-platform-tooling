apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-loki
  namespace: monitoring
  labels:
    release: platform-monitoring
spec:
  namespaceSelector:
    matchNames:
    - logging
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-loki
    matchExpressions:
    - key: prometheus.io/service-monitor
      operator: NotIn
      values:
      - 'false'
    - key: app.kubernetes.io/component
      operator: In
      values:
      - write
      - read
      - backend
      - gateway
  endpoints:
  - port: http-metrics
    path: /metrics
    interval: 30s
    relabelings:
    - sourceLabels:
      - __meta_kubernetes_service_label_app_kubernetes_io_component
      targetLabel: component
