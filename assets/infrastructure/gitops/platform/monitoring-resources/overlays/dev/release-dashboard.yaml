# gitops/platform/monitoring-resources/overlays/dev/release-dashboard.yaml
# 원본 observability/dashboards/release.json.tpl + render.py 는 미전달이라 새로 적었습니다 (그림 8 · 12칸 × 2열 · editable false · timezone utc 는 원본 설명대로).
apiVersion: v1                        # 예: v1
kind: ConfigMap                       # 예: ConfigMap (sidecar 가 /tmp/dashboards 에 놓음)
metadata:
  name: platform-release-dashboard    # 예: platform-release-dashboard
  namespace: monitoring               # 예: monitoring
  labels:
    grafana_dashboard: "1"            # 예: "1" (chart 기본 sidecar.dashboards.label · labelValue)
data:
  contract2whale-release.json: |
    {
      "uid": "contract2whale-release",
      "title": "contract2whale release",
      "editable": false,
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "platform",
        "release"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "environment",
            "type": "constant",
            "query": "dev",
            "hide": 2
          },
          {
            "name": "cluster",
            "type": "constant",
            "query": "contract2whale-dev-eks",
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate by service",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "sum by (service_name) (rate(course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error ratio (5xx) by service",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "sum by (service_name) (rate(course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\", status_code=~\"5..\"}[$__rate_interval])) / sum by (service_name) (rate(course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p95 latency by service",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "histogram_quantile(0.95, sum by (service_name, le) (rate(course_http_request_duration_seconds_bucket{environment=\"$environment\", cluster=\"$cluster\"}[$__rate_interval])))",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 4,
          "type": "table",
          "title": "Releases observed (last 1h)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "count by (service_name, release) (last_over_time(course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\"}[1h]))",
              "legendFormat": "{{service_name}} {{release}}",
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP 503 increase (5m)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "sum by (service_name) (increase(course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\", status_code=\"503\"}[5m]))",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Request rate by route",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "topk(10, sum by (http_route) (rate(course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\"}[$__rate_interval])))",
              "legendFormat": "{{http_route}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Scrape targets up (application)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "sum by (service_name) (up{environment=\"$environment\", cluster=\"$cluster\", job=~\".*contract2whale.*\"})",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Series without recent requests",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "thanos"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "thanos"
              },
              "expr": "count by (service_name) (course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\"} unless rate(course_http_requests_total{environment=\"$environment\", cluster=\"$cluster\"}[$__rate_interval]) > 0)",
              "legendFormat": "{{service_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
