# gitops/platform/loki/values/dev.yaml
# 로그 저장소: grafana-community loki chart 18.13.0 (이미지 3.7.7) 의 values 입니다. 쓰기 · 읽기 · backend 세 역할로 나눈 SimpleScalable 배치 + Loki gateway + 보관 2종.
deploymentMode: SimpleScalable  # 예: SimpleScalable (세 역할 배치 방식; 단일 프로세스 배치는 쓰지 않음)
fullnameOverride: platform-loki # 예: platform-loki (gateway Service 가 platform-loki-gateway 가 됨 — 계약의 loki_endpoint)

loki:
  image:
    tag: "3.7.7" # 예: 3.7.7 (chart appVersion 과 같은 공식 이미지 버전; versions.env 의 LOKI_IMAGE_VERSION)
  auth_enabled: false # 예: false (단일 사용 구역이므로 사용자 구분 머리말을 요구하지 않음; tenant 는 "fake")
  # 저장소 연결입니다. 접근 키를 적지 않습니다. 자격 증명은 Pod Identity 가 임시로 내려 줍니다 (SDK 기본 경로).
  storage:
    type: s3 # 예: s3 (객체 저장소 방식)
    bucketNames:
      chunks: "example-dev-logs-bucket" # 예: cp-dev-observability-logs-111111111111-ap-northeast-2 (덩어리)
      ruler: "example-dev-logs-bucket"  # 예: 같은 저장소 (규칙 파일)
      admin: "example-dev-logs-bucket"  # 예: 같은 저장소 (관리 정보)
    s3:
      region: "ap-northeast-2" # 예: ap-northeast-2 (계약의 region)
      s3ForcePathStyle: false            # 예: false (저장소 이름을 주소 앞에 두는 방식)
  schemaConfig:
    configs:
      - from: "2024-04-01"    # 예: 이 설정이 적용되기 시작하는 날짜
        store: tsdb           # 예: tsdb (색인 저장 방식)
        object_store: s3      # 예: s3 (덩어리와 색인이 가는 곳)
        schema: v13           # 예: v13 (구조화 메타데이터를 지원하는 색인 버전)
        index:
          prefix: loki_index_ # 예: loki_index_ (색인 파일 이름 앞부분)
          period: 24h         # 예: 24h (색인 파일 하나가 덮는 기간)
  # 복제 목표는 3입니다. 실제 ring 참여·건강 상태와 쓰기 quorum을 확인해야 지속 수신을 판단할 수 있습니다.
  commonConfig:
    replication_factor: 3 # 예: 3 (복제 수. 쓰기 역할 대수와 같게 둠)
  limits_config:
    allow_structured_metadata: true    # 예: true (반드시 true. 끄면 OTLP 로그가 400 으로 거부됨)
    volume_enabled: true               # 예: true (흐름별 사용량 조회를 켬)
    retention_period: 720h             # 예: 720h = 30일 (저장소 기준일 90일보다 짧아야 함 — check-retention-order.sh)
    max_query_lookback: 720h           # 예: 720h (보존 기간과 같은 조회 범위 상한)
    ingestion_rate_mb: 8               # 예: 8 (한 사용 구역의 초당 수집 상한, MB)
    ingestion_burst_size_mb: 16        # 예: 16 (짧은 시간 몰릴 때 허용하는 상한, MB)
    reject_old_samples: true           # 예: true (너무 오래된 시각의 줄을 거부)
    reject_old_samples_max_age: 168h   # 예: 168h (7일보다 오래된 시각의 줄은 받지 않음)
    max_streams_per_user: 0            # 예: 0 (ingester 별 로컬 상한을 끄고 전역 상한으로 관리)
    max_global_streams_per_user: 10000 # 예: 10000 (tenant 전체의 활성 흐름 상한)
  # 보존 기간만 적으면 지워지지 않습니다. 정리를 켜야 backend 역할이 실제로 지웁니다 (정리 역할 Pod Identity 가 DeleteObject 를 가짐).
  compactor:
    retention_enabled: true                # 예: true (보존 기간이 지난 부분을 실제로 지움)
    delete_request_store: s3               # 예: s3 (사람이 넣은 삭제 요청을 적어 둘 곳)
    working_directory: /var/loki/compactor # 예: 색인을 합치는 동안 쓰는 로컬 경로
    compaction_interval: 10m               # 예: 10m (색인 합치기 주기)
    retention_delete_delay: 2h             # 예: 2h (지울 것으로 표시한 뒤 실제 삭제까지의 지연)
  server:
    log_format: json # 예: json (기록 형식; 조회 도구가 필드로 읽음)
    log_level: info  # 예: info

serviceAccount:
  create: false                      # 예: false
  name: default                      # 예: default
  automountServiceAccountToken: true # 예: true (backend 의 rule sidecar 가 API 를 조회)

# 쓰기 역할입니다. 올라가기 전 구간을 볼륨에 담고 아래 조건으로 영역 분산을 요구합니다.
write:
  fullnameOverride: platform-loki-write # 예: platform-loki-write (chart 기본은 loki-write; 계약 · hook 이 이 이름을 씀)
  serviceAccount:
    create: true                       # 예: true
    name: platform-loki-write
    automountServiceAccountToken: true # 예: true
  replicas: 3 # 예: 3 (복제 목표와 같은 수; 실제 노드·AZ 배치는 별도 확인)
  persistence:
    enabled: true              # 예: true (올라가기 전 구간을 볼륨에)
    storageClass: platform-gp3 # 예: platform-gp3
    size: 10Gi                 # 예: 10Gi (실습 규모; 원본 20Gi — 수집량에 따라 조정)
  resources:
    requests: {cpu: 250m, memory: 512Mi} # 예: 요청량 (실습 규모; 원본 500m · 1Gi)
    limits: {memory: 2Gi}                # 예: 메모리 상한
  nodeSelector: {workload: observability} # 예: 관측 노드에 배치
  tolerations:
    - {key: workload, operator: Equal, value: observability, effect: NoSchedule} # 예: 관측 노드의 taint 를 견딤
  # 3개 영역 분산을 요구합니다. 영역 장애 중 수신 가능 여부는 실제 ring·quorum·남은 용량으로 판단합니다.
  topologySpreadConstraints:
    - maxSkew: 1                                 # 예: 영역 간 개수 차이 상한
      minDomains: 3
      topologyKey: topology.kubernetes.io/zone   # 예: 영역 표시 키
      whenUnsatisfiable: DoNotSchedule           # 예: 조건을 못 맞추면 배치하지 않음
      labelSelector:
        matchLabels: {app.kubernetes.io/instance: platform-loki, app.kubernetes.io/component: write} # 예: 같은 역할끼리만 셈

# 읽기 역할입니다. 질의를 쪼개 실행합니다. 볼륨이 필요 없습니다.
read:
  fullnameOverride: platform-loki-read # 예: platform-loki-read (chart 기본은 loki-read; 계약 · hook 이 이 이름을 씀)
  serviceAccount:
    create: true                       # 예: true
    name: platform-loki-read
    automountServiceAccountToken: true # 예: true
  replicas: 3 # 예: 3
  resources:
    requests: {cpu: 250m, memory: 512Mi} # 예: 요청량 (실습 규모)
    limits: {memory: 2Gi}                # 예: 질의가 클 때를 대비한 상한
  nodeSelector: {workload: observability} # 예: 관측 노드에 배치
  tolerations:
    - {key: workload, operator: Equal, value: observability, effect: NoSchedule} # 예: 관측 노드의 taint 를 견딤

# backend 역할입니다. 색인 합치기와 보존 정리, 질의 큐, 규칙 평가를 맡습니다.
backend:
  fullnameOverride: platform-loki-backend # 예: platform-loki-backend (chart 기본은 loki-backend; 계약 · hook 이 이 이름을 씀)
  serviceAccount:
    create: true                       # 예: true
    name: platform-loki-backend
    automountServiceAccountToken: true # 예: true
  replicas: 3 # 예: 3 (정리 작업은 ring 에서 선택된 한 대가 맡음)
  persistence:
    enabled: true              # 예: true (색인 합치기 작업 디렉터리)
    storageClass: platform-gp3 # 예: platform-gp3
    size: 10Gi                 # 예: 10Gi (실습 규모)
  resources:
    requests: {cpu: 200m, memory: 512Mi} # 예: 요청량 (실습 규모)
    limits: {memory: 2Gi}                # 예: 메모리 상한
  nodeSelector: {workload: observability} # 예: 관측 노드에 배치
  tolerations:
    - {key: workload, operator: Equal, value: observability, effect: NoSchedule} # 예: 관측 노드의 taint 를 견딤

gateway:
  enabled: true # 예: true (쓰기와 조회를 나눠 보내는 gateway)
  replicas: 2   # 예: 2 (한 대가 빠져도 수집이 멈추지 않도록)
  service:
    type: ClusterIP # 예: ClusterIP (클러스터 안에서만)
    port: 80        # 예: 80 (gateway 가 받는 포트)
  nodeSelector: {workload: observability} # 예: 관측 노드에 배치
  tolerations:
    - {key: workload, operator: Equal, value: observability, effect: NoSchedule} # 예: 관측 노드의 taint 를 견딤

# 조회에서 같은 덩어리를 반복해 받지 않도록 보관을 둡니다. 크기를 명시해 기본값(8 GiB)을 쓰지 않습니다.
chunksCache:
  enabled: true         # 예: true (덩어리 보관)
  allocatedMemory: 1024 # 예: 1024 (보관에 주는 메모리, MB; 실습 규모 — 원본 2048)
  nodeSelector: {workload: observability} # 예: 관측 노드에 배치
  tolerations:
    - {key: workload, operator: Equal, value: observability, effect: NoSchedule} # 예: 관측 노드의 taint 를 견딤
resultsCache:
  enabled: true        # 예: true (질의 결과 보관)
  allocatedMemory: 512 # 예: 512 (MB; 실습 규모 — 원본 1024)
  nodeSelector: {workload: observability} # 예: 관측 노드에 배치
  tolerations:
    - {key: workload, operator: Equal, value: observability, effect: NoSchedule} # 예: 관측 노드의 taint 를 견딤

# 이 구성에서 쓰지 않는 부속 배치를 끕니다. 노드마다 뜨는 점검용 배치(canary)는 taint 설정이 따로 필요합니다.
lokiCanary:
  enabled: false # 예: false (점검용 배치를 만들지 않음)
test:
  enabled: false # 예: false (시험용 Pod 을 만들지 않음)
# 수집 선언은 monitoring-resources의 servicemonitor-platform-loki.yaml이 소유합니다 (chart ServiceMonitor 끔).
monitoring:
  serviceMonitor:
    enabled: false # 예: false
  selfMonitoring:
    enabled: false # 예: false (자기 로그를 자기에게 보내는 GrafanaAgent 구성을 만들지 않음)
    grafanaAgent:
      installOperator: false # 예: false
  dashboards:
    enabled: false
  rules:
    enabled: false # 예: false (규칙은 monitoring-resources의 prometheusrule-platform-loki.yaml 소유)
