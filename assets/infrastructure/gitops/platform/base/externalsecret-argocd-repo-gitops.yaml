apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-gitops
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: delivery-secrets
    kind: SecretStore
  target:
    name: argocd-repo-gitops
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: REPLACED_BY_KUSTOMIZE
        sshPrivateKey: '{{ .sshPrivateKey }}'
  data:
  - secretKey: sshPrivateKey
    remoteRef:
      key: delivery/argocd-repo-key
      property: sshPrivateKey
