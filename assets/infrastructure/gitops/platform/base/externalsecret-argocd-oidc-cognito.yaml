apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-cognito
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: delivery-secrets
    kind: SecretStore
  target:
    name: argocd-oidc-cognito
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        clientSecret: '{{ .clientSecret }}'
  data:
  - secretKey: clientSecret
    remoteRef:
      key: delivery/argocd-oidc-client
      property: clientSecret
