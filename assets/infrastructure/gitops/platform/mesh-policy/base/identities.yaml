# 신분은 네임스페이스과 ServiceAccount 두 값으로 만들어집니다 (cluster.local/ns/<네임스페이스>/sa/<계정>). 받는 쪽 정책이 이 이름을 그대로 씁니다.
apiVersion: v1                                          # 예: v1
kind: ServiceAccount                                    # 예: ServiceAccount
metadata:
  name: mesh-server                                     # 예: mesh-server (받는 쪽 신분; dst.identity 에 남음)
  namespace: team-mesh-check                            # 예: team-mesh-check
automountServiceAccountToken: false                     # 예: false (API 토큰을 Pod 에 마운트하지 않음; 신분은 ztunnel 이 CA 에서 받음)
---
apiVersion: v1                                          # 예: v1
kind: ServiceAccount                                    # 예: ServiceAccount
metadata:
  name: mesh-client                                     # 예: mesh-client (허용할 출발 신분; AuthorizationPolicy principals 의 값)
  namespace: team-mesh-check                            # 예: team-mesh-check
automountServiceAccountToken: false                     # 예: false
---
apiVersion: v1                                          # 예: v1
kind: ServiceAccount                                    # 예: ServiceAccount
metadata:
  name: mesh-stranger                                   # 예: mesh-stranger (같은 네임스페이스의 다른 신분; 거부 확인용)
  namespace: team-mesh-check                            # 예: team-mesh-check
automountServiceAccountToken: false                     # 예: false
---
apiVersion: v1                                          # 예: v1
kind: ServiceAccount                                    # 예: ServiceAccount
metadata:
  name: mesh-outside                                    # 예: mesh-outside (편입 밖 신분; 평문 거부 확인용)
  namespace: team-mesh-outside                          # 예: team-mesh-outside
automountServiceAccountToken: false                     # 예: false
---
# 받는 쪽 주소를 이름으로 고정합니다. ClusterIP 이므로 클러스터 공통 서비스 tenant-clusterip-services 정책을 통과합니다.
apiVersion: v1                                          # 예: v1
kind: Service                                           # 예: Service
metadata:
  name: mesh-server                                     # 예: mesh-server (이름 해석과 ClusterIP; ztunnel 로그의 dst.service = mesh-server.team-mesh-check.svc.cluster.local)
  namespace: team-mesh-check                            # 예: team-mesh-check
spec:
  selector:
    app: mesh-server                                    # 예: app: mesh-server (server Pod 만 endpoint 로 등록)
  ports:
    - name: http                                        # 예: http
      port: 8080                                        # 예: 8080 (AuthorizationPolicy to.operation.ports 와 같은 값)
      targetPort: 8080                                  # 예: 8080
