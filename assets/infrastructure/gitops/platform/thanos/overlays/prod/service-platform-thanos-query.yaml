apiVersion: v1
kind: Service
metadata:
  name: platform-thanos-query
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform-thanos
    app.kubernetes.io/component: query
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-thanos
    app.kubernetes.io/component: query
  ports:
  - name: http
    port: 9090
    targetPort: http
  - name: grpc
    port: 10901
    targetPort: grpc
