apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-thanos-query
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform-thanos
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-thanos
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-thanos
        app.kubernetes.io/component: query
    spec:
      serviceAccountName: platform-thanos-query
      automountServiceAccountToken: false
      nodeSelector:
        workload: observability
      tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: platform-thanos
                  app.kubernetes.io/component: query
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: thanos
        image: quay.io/thanos/thanos:v0.41.0
        args:
        - query
        - --log.level=info
        - --log.format=logfmt
        - --grpc-address=0.0.0.0:10901
        - --http-address=0.0.0.0:10902
        - --query.replica-label=prometheus_replica
        - --query.auto-downsampling
        - --endpoint=dnssrv+_grpc._tcp.platform-monitoring-thanos-discovery.monitoring.svc.cluster.local
        - --endpoint=dnssrv+_grpc._tcp.platform-thanos-storegateway.monitoring.svc.cluster.local
        ports:
        - name: grpc
          containerPort: 10901
        - name: http
          containerPort: 10902
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
