apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-platform-thanos-compactor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform-thanos
    app.kubernetes.io/component: compactor
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  storageClassName: platform-gp3
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
