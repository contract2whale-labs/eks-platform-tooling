apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-thanos-query
  namespace: monitoring
  labels:
    release: platform-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-thanos
      app.kubernetes.io/component: query
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
