apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-thanos-storegateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform-thanos
    app.kubernetes.io/component: storegateway
spec:
  serviceName: platform-thanos-storegateway
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-thanos
      app.kubernetes.io/component: storegateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-thanos
        app.kubernetes.io/component: storegateway
      annotations:
        platform.example/objstore-config-sha256: 
          532f4f6d343b6de2515404b08216d173038c92ea64f550843d3cd0b40996a868
    spec:
      serviceAccountName: platform-thanos-store
      automountServiceAccountToken: false
      nodeSelector:
        workload: observability
      tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: platform-thanos
                  app.kubernetes.io/component: storegateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: thanos
        image: quay.io/thanos/thanos:v0.41.0
        args:
        - store
        - --log.level=info
        - --log.format=logfmt
        - --grpc-address=0.0.0.0:10901
        - --http-address=0.0.0.0:10902
        - --data-dir=/var/thanos/store
        - --objstore.config-file=/etc/thanos/objstore.yml
        ports:
        - name: grpc
          containerPort: 10901
        - name: http
          containerPort: 10902
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 30
          failureThreshold: 4
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          failureThreshold: 20
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: objstore
          mountPath: /etc/thanos
          readOnly: true
        - name: data
          mountPath: /var/thanos/store
      volumes:
      - name: objstore
        secret:
          secretName: thanos-objstore
          items:
          - key: objstore.yml
            path: objstore.yml
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: platform-gp3
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
