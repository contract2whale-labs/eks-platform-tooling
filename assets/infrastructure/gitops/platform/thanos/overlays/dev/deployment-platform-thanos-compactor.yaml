apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-thanos-compactor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform-thanos
    app.kubernetes.io/component: compactor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-thanos
      app.kubernetes.io/component: compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-thanos
        app.kubernetes.io/component: compactor
      annotations:
        platform.example/objstore-config-sha256: 
          532f4f6d343b6de2515404b08216d173038c92ea64f550843d3cd0b40996a868
    spec:
      serviceAccountName: platform-thanos-compact
      automountServiceAccountToken: false
      nodeSelector:
        workload: observability
      tolerations:
      - key: workload
        operator: Equal
        value: observability
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: thanos
        image: quay.io/thanos/thanos:v0.41.0
        args:
        - compact
        - --log.level=info
        - --log.format=logfmt
        - --http-address=0.0.0.0:10902
        - --data-dir=/var/thanos/compact
        - --objstore.config-file=/etc/thanos/objstore.yml
        - --wait
        - --wait-interval=5m
        - --retention.resolution-raw=15d
        - --retention.resolution-5m=90d
        - --retention.resolution-1h=365d
        - --delete-delay=48h
        - --compact.concurrency=1
        - --downsample.concurrency=1
        ports:
        - name: http
          containerPort: 10902
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 6Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: objstore
          mountPath: /etc/thanos
          readOnly: true
        - name: data
          mountPath: /var/thanos/compact
      volumes:
      - name: objstore
        secret:
          secretName: thanos-objstore
          items:
          - key: objstore.yml
            path: objstore.yml
      - name: data
        persistentVolumeClaim:
          claimName: data-platform-thanos-compactor
