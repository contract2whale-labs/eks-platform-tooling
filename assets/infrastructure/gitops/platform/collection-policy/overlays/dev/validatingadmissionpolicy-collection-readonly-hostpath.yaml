apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: collection-readonly-hostpath
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        platform-role: observability
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: hostPathVolumes
    expression: 'has(object.spec.volumes) ? object.spec.volumes.filter(v, has(v.hostPath))
      : []'
  - name: hostPathNames
    expression: variables.hostPathVolumes.map(v, v.name)
  - name: allContainers
    expression: 'object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])'
  validations:
  - expression: variables.allContainers.all(c, !has(c.volumeMounts) || c.volumeMounts.all(m,
      !(m.name in variables.hostPathNames) || (has(m.readOnly) && m.readOnly)))
    message: Collection pods must mount host log paths read-only; use a separate writable
      volume for checkpoints.
  - expression: variables.hostPathVolumes.all(v, v.hostPath.path == '/var/log' ||
      v.hostPath.path.startsWith('/var/log/'))
    message: Collection pods may only reference host paths under /var/log.
