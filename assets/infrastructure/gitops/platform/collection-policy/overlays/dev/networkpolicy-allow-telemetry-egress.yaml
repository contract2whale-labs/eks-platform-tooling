apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-egress
  namespace: team-platform-check
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          platform-role: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/component: collection-gateway
    ports:
    - protocol: TCP
      port: 4317
    - protocol: TCP
      port: 4318
