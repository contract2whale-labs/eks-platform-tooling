# 예시 요청입니다. 승인된 현재 operator role ARN·계정·UUID와 발행 receipt의 image@sha256:digest로 바꾼 source만 적용합니다. reviewed tag는 실행 승인이 아닙니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: database-bootstrap-reviewedrequest001
  namespace: contract2whale-demo
  labels:
    app.kubernetes.io/name: database-bootstrap
    app.kubernetes.io/part-of: contract2whale
    contract2whale.course/run-id: a3d58c60-12ef-4cf1-8ed9-76f16b880001
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-bootstrap
        app.kubernetes.io/part-of: contract2whale
        contract2whale.course/run-id: a3d58c60-12ef-4cf1-8ed9-76f16b880001
    spec:
      serviceAccountName: database-operator
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        workload: app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: 222222222222.dkr.ecr.ap-northeast-2.amazonaws.com/contract2whale/database-operator:reviewed
        command:
        - bash
        - /opt/contract2whale/operator/bootstrap.sh
        envFrom:
        - configMapRef:
            name: database-bootstrap-reviewedrequest001
        env:
        - name: BOOTSTRAP_RUN_ID
          value: a3d58c60-12ef-4cf1-8ed9-76f16b880001
        - name: EXPECTED_OPERATOR_ROLE_ARN
          value: arn:aws:iam::222222222222:role/platform/contract2whale-prod-eks-app-database-operator
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
