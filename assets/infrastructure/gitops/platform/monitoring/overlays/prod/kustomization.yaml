apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
secretGenerator:
- name: thanos-objstore
  files:
  - objstore.yml
  options:
    disableNameSuffixHash: true
    labels:
      app.kubernetes.io/part-of: monitoring
      platform.example/config-kind: noncredential-objstore
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=confirm,Delete=confirm
