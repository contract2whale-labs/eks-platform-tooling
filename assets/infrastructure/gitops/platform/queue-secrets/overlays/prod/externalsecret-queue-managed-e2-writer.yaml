apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: queue-managed-e2-writer
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: queue-managed
    kind: SecretStore
  target:
    name: queue-managed-e2-writer
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: QUEUE_USERNAME
    remoteRef:
      key: AmazonMSK_cp-prod-traces-queue_tempo-distributor
      property: username
  - secretKey: QUEUE_PASSWORD
    remoteRef:
      key: AmazonMSK_cp-prod-traces-queue_tempo-distributor
      property: password
