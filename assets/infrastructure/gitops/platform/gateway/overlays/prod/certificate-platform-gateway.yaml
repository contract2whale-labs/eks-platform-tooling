apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-gateway
  namespace: platform-gateway
spec:
  secretName: platform-gateway-tls
  dnsNames:
  - prod.playdevops.click
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
