apiVersion: v1
kind: Service
metadata:
  name: platform-tempo-active-query
  namespace: monitoring
  labels:
    platform.example/active-trace-backend: self-managed
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: platform-tempo
    app.kubernetes.io/component: query-frontend
  ports:
  - name: http
    port: 3200
    targetPort: 3200
    protocol: TCP
